name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tidy
        run: go mod tidy -diff && go -C tools mod tidy -diff

      - name: Generated code
        run: make generate && git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Build
        run: make build && ./bin/auth1 version

      - name: Configuration example
        run: ./bin/auth1 config check --config config.example.yaml

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Test
        env:
          AUTH1_REQUIRE_DOCKER: "1" # repository tests fail, not skip, without Docker
        run: go test -race ./...

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Contract lint
        run: make spec-lint

      - name: Breaking changes
        continue-on-error: true # warn-only until v1.0.0 (TDD-08 §10)
        run: make spec-diff
