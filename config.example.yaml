# Example configuration for auth-service
# Copy this file to config.yaml and adjust values as needed
# This service is platform-agnostic and can be used for any application

server:
  host: "0.0.0.0"
  port: "8080"

database:
  host: "localhost"
  port: "5432"
  user: "auth1"
  password: "password"
  name: "auth1"
  ssl_mode: "disable"
  schema: ""  # optional: isolate tables in a named schema (e.g. "auth"); defaults to public

redis:
  host: "localhost"
  port: "6379"
  password: ""
  db: 0

jwt:
  private_key_path: "./assets/private_key.pem"
  public_key_path: "./assets/public_key.pem"
  access_token_ttl: 900      # 15 minutes
  refresh_token_ttl: 604800  # 7 days

amqp:
  url: "amqp://auth1:password@localhost:5672/"
  exchange: "auth1.events"
  outbox_poll_secs: 5    # how often the relay polls for pending rows (seconds)
  max_attempts: 5        # max publish attempts before marking a row as failed
  batch_size: 10         # rows processed per poll cycle

sms:
  service_url: ""            # Set to enable SMS-based authentication
  timeout: 30
  retry_count: 3
  provider: ""               # twilio, nexmo, etc.

security:
  max_login_attempts: 5
  lockout_duration_minutes: 30
  password_min_length: 8
  password_require_upper: true
  password_require_lower: true
  password_require_number: true
  password_require_special: false
  password_reset_ttl: 60     # 60 minutes

app:
  name: "auth-service"
  environment: "development"  # development, staging, production
  log_level: "info"          # debug, info, warn, error
  otp_length: 6
  otp_ttl: 300               # 5 minutes

  # Feature flags - enable/disable authentication methods
  enable_email_auth: true
  enable_phone_auth: false
  enable_password_auth: true
  enable_otp_auth: true
  enable_2fa: true
  enable_audit_log: true
  require_email_verification: true
  require_phone_verification: false

  # TOTP secret encryption (AES-256-GCM). REQUIRED when enable_2fa is true.
  # Generate with: openssl rand -base64 32
  totp_encryption_key: ""
  totp_challenge_ttl_sec: 300    # 5 minutes — how long a login 2FA challenge stays valid

rate_limit:
  enabled: true  # Set to false to disable rate limiting (not recommended for production)

  # Global rate limit (applies to all endpoints per IP)
  global_limit: 1000         # Max requests per window
  global_window: 60          # Window in seconds (1 minute)

  # Login endpoint rate limits
  login_ip_limit: 10         # Max login attempts per IP
  login_ip_window: 300       # Window in seconds (5 minutes)
  login_email_limit: 5       # Max login attempts per email
  login_email_window: 900    # Window in seconds (15 minutes)

  # Signup endpoint rate limits
  signup_ip_limit: 3         # Max signups per IP
  signup_ip_window: 3600     # Window in seconds (1 hour)

  # OTP request endpoint rate limits
  otp_email_limit: 3         # Max OTP requests per email
  otp_email_window: 300      # Window in seconds (5 minutes)

  # OTP verify endpoint rate limits
  otp_verify_email_limit: 10     # Max OTP verifications per email
  otp_verify_email_window: 600   # Window in seconds (10 minutes)

  # Refresh token endpoint rate limits
  refresh_limit: 10          # Max refresh requests
  refresh_window: 60         # Window in seconds (1 minute)

  # 2FA setup endpoint rate limits
  twofa_setup_limit: 3       # Max 2FA setup attempts per user
  twofa_setup_window: 3600   # Window in seconds (1 hour)

  # 2FA verify endpoint rate limits
  twofa_verify_limit: 5      # Max 2FA verification attempts
  twofa_verify_window: 300   # Window in seconds (5 minutes)

  # Authenticated endpoints rate limits (per user)
  authenticated_limit: 100   # Max requests per user
  authenticated_window: 60   # Window in seconds (1 minute)

# Service-to-service authentication
# API keys used by downstream services (e.g. order-service) to call /api/v1/auth/introspect.
# Each consuming service should have its own key so it can be rotated independently.
# Generate with: openssl rand -hex 32
services:
  allowed_api_keys: []
  # - "your-order-service-api-key-here"
  # - "your-inventory-service-api-key-here"