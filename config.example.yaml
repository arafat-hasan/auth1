# Example configuration for auth-service
# Copy this file to config.yaml and adjust values as needed
# This service is platform-agnostic and can be used for any application

server:
  host: "0.0.0.0"
  port: "8080"

database:
  host: "localhost"
  port: "5432"
  user: "auth_service"
  password: "password"
  name: "auth_service"
  ssl_mode: "disable"

redis:
  host: "localhost"
  port: "6379"
  password: ""
  db: 0

jwt:
  private_key_path: "./assets/private_key.pem"
  public_key_path: "./assets/public_key.pem"
  access_token_ttl: 900      # 15 minutes
  refresh_token_ttl: 604800  # 7 days

email:
  service_url: "http://localhost:8081"
  timeout: 30
  retry_count: 3

sms:
  service_url: ""            # Set to enable SMS-based authentication
  timeout: 30
  retry_count: 3
  provider: ""               # twilio, nexmo, etc.

security:
  max_login_attempts: 5
  lockout_duration_minutes: 30
  password_min_length: 8
  password_require_upper: true
  password_require_lower: true
  password_require_number: true
  password_require_special: false
  password_reset_ttl: 60     # 60 minutes

app:
  name: "auth-service"
  environment: "development"  # development, staging, production
  log_level: "info"          # debug, info, warn, error
  otp_length: 6
  otp_ttl: 300               # 5 minutes
  
  # Feature flags - enable/disable authentication methods
  enable_email_auth: true
  enable_phone_auth: false
  enable_password_auth: true
  enable_otp_auth: true
  enable_2fa: true
  enable_audit_log: true
  require_email_verification: true
  require_phone_verification: false 