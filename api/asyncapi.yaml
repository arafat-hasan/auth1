asyncapi: 3.0.0
info:
  title: auth1 lifecycle events
  version: 1.0.0
  description: |
    Account lifecycle events published by auth1 through its transactional outbox, to its own
    topic exchange (`events.exchange`, default `auth1.events`). The routing key is the event type.

    Every message is a **CloudEvents 1.0** event in structured JSON mode
    (`application/cloudevents+json`). Delivery is at least once; consumers deduplicate on `id`.
    One account's events are published in order; consumers that keep state compare
    `accountversion`.

    **No identifier value (email, phone) and no secret (password, code, token) ever appears in
    an event.** A consumer that needs a value reads it from the directory API.

    Design: docs/design.md §D-12.
  contact:
    name: auth1 maintainers
    url: https://github.com/arafat-hasan/auth1
  license:
    name: Proprietary
  tags:
    - name: identity
      description: Account lifecycle
defaultContentType: application/cloudevents+json
servers:
  broker:
    host: broker.example.internal:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: The deploying product's broker. auth1's user may write only to its own exchange
channels:
  account_registered:
    address: account.registered
    title: account.registered
    description: 'A registration completed: every required identifier is verified and the account is active.'
    messages:
      account_registered_v1:
        $ref: '#/components/messages/account_registered_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_identifier_verified:
    address: account.identifier_verified
    title: account.identifier_verified
    description: An identifier was verified, at registration or later.
    messages:
      account_identifier_verified_v1:
        $ref: '#/components/messages/account_identifier_verified_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_identifier_changed:
    address: account.identifier_changed
    title: account.identifier_changed
    description: An email or phone change applied. The previous identifier is no longer current.
    messages:
      account_identifier_changed_v1:
        $ref: '#/components/messages/account_identifier_changed_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_password_changed:
    address: account.password_changed
    title: account.password_changed
    description: The account holder changed the password. Every other session was revoked.
    messages:
      account_password_changed_v1:
        $ref: '#/components/messages/account_password_changed_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_password_reset:
    address: account.password_reset
    title: account.password_reset
    description: A password reset completed. Every session was revoked; the status did not change.
    messages:
      account_password_reset_v1:
        $ref: '#/components/messages/account_password_reset_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_status_changed:
    address: account.status_changed
    title: account.status_changed
    description: The account's status changed through account control.
    messages:
      account_status_changed_v1:
        $ref: '#/components/messages/account_status_changed_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
