                  account_id:
                    $ref: '#/components/schemas/AccountId'
                  status:
                    $ref: '#/components/schemas/AccountStatus'
                  previous_status:
                    $ref: '#/components/schemas/AccountStatus'
                  reason_code:
                    type: string
                    description: From the deployment's reason codes. Present for suspended and banned
                  until:
                    type: string
                    format: date-time
                    description: Suspended only. Information; auth1 never lifts a status on its own
                  actor:
                    $ref: '#/components/schemas/Actor'
      examples:
        - name: example
          payload:
            specversion: '1.0'
            id: 0192f1c4-8d3a-7b2e-9f10-2c4d5e6f7a8b
            source: /auth1
            type: account.status_changed
            subject: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
            time: '2026-10-16T09:30:00.000Z'
            datacontenttype: application/json
            dataversion: 1
            accountversion: 3
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            data:
              account_id: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
              status: suspended
              previous_status: active
              reason_code: policy_violation
              until: '2026-11-15T00:00:00Z'
              actor:
                kind: service
                id: spiffe://cluster.local/ns/example/sa/moderation
                on_behalf_of: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a
