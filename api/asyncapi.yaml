components:
  schemas:
    AccountId:
      type: string
      format: uuid
    AccountStatus:
      type: string
      enum:
        - pending
        - active
        - suspended
        - banned
        - deleted
    IdentifierType:
      type: string
      description: A type from the deployment's identifier policy
      pattern: ^[a-z][a-z0-9_]{0,31}$
    Role:
      type: string
      description: A role from the deployment's catalog
      pattern: ^[a-z][a-z0-9_]{0,49}$
    Actor:
      type: object
      description: Who caused the change
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - account
            - service
            - system
        id:
          type: string
          description: The account id, or the calling service's workload identity or client id
        on_behalf_of:
          type: string
          format: uuid
          description: The person a calling service acted for, from its Auth1-Actor header
    CloudEvent:
      type: object
      description: CloudEvents 1.0 attributes, as auth1 sets them
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - dataversion
        - accountversion
        - data
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
          description: UUIDv7, stable per outbox row. The deduplication key
        source:
          type: string
          format: uri-reference
          description: The deployment's `events.source`, default /auth1
        type:
          type: string
          description: The event type; also the routing key
        subject:
          type: string
          format: uuid
          description: The account id
        time:
          type: string
          format: date-time
          description: When the change committed
        datacontenttype:
          type: string
          const: application/json
        dataversion:
          type: integer
          minimum: 1
          description: Extension. The version of the `data` schema
        accountversion:
          type: integer
          minimum: 1
          description: Extension. The account's version after the change
        traceparent:
          type: string
          description: Extension (distributed tracing). W3C trace context
        tracestate:
          type: string
          description: Extension (distributed tracing)
        data:
          type: object
  messageTraits:
    cloudEvent:
      contentType: application/cloudevents+json
      bindings:
        amqp:
          contentEncoding: utf-8
          bindingVersion: 0.3.0
  messages:
    account_registered_v1:
      name: account.registered
      title: account.registered v1
      summary: 'A registration completed: every required identifier is verified and the account is active.'
      traits:
        - $ref: '#/components/messageTraits/cloudEvent'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type:
                const: account.registered
              dataversion:
                const: 1
              data:
                type: object
                additionalProperties: false
                required:
                  - account_id
                  - roles
                  - client_id
                  - locale
                properties:
                  account_id:
                    $ref: '#/components/schemas/AccountId'
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  client_id:
                    type: string
                    description: The client the account registered through, or `invitation`
                  locale:
                    type: string
      examples:
        - name: example
          payload:
            specversion: '1.0'
            id: 0192f1c4-8d3a-7b2e-9f10-2c4d5e6f7a8b
            source: /auth1
            type: account.registered
            subject: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
            time: '2026-10-16T09:30:00.000Z'
            datacontenttype: application/json
            dataversion: 1
            accountversion: 3
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            data:
              account_id: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
              roles:
                - user
              client_id: web
              locale: en
    account_identifier_verified_v1:
      name: account.identifier_verified
      title: account.identifier_verified v1
      summary: An identifier was verified, at registration or later.
      traits:
        - $ref: '#/components/messageTraits/cloudEvent'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type:
                const: account.identifier_verified
              dataversion:
                const: 1
              data:
                type: object
                additionalProperties: false
                required:
                  - account_id
                  - identifier_id
                  - identifier_type
                properties:
                  account_id:
                    $ref: '#/components/schemas/AccountId'
                  identifier_id:
                    type: string
                    format: uuid
                  identifier_type:
                    $ref: '#/components/schemas/IdentifierType'
      examples:
        - name: example
          payload:
            specversion: '1.0'
            id: 0192f1c4-8d3a-7b2e-9f10-2c4d5e6f7a8b
            source: /auth1
            type: account.identifier_verified
            subject: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
            time: '2026-10-16T09:30:00.000Z'
            datacontenttype: application/json
            dataversion: 1
            accountversion: 3
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            data:
              account_id: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
              identifier_id: 0b9e8d7c-6a5f-4e3d-8c2b-1a0f9e8d7c6b
              identifier_type: phone
    account_identifier_changed_v1:
      name: account.identifier_changed
      title: account.identifier_changed v1
      summary: An email or phone change applied. The previous identifier is no longer current.
      traits:
        - $ref: '#/components/messageTraits/cloudEvent'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type:
                const: account.identifier_changed
              dataversion:
                const: 1
              data:
                type: object
                additionalProperties: false
                required:
                  - account_id
                  - identifier_type
                  - identifier_id
                  - previous_identifier_id
                properties:
                  account_id:
                    $ref: '#/components/schemas/AccountId'
                  identifier_type:
                    $ref: '#/components/schemas/IdentifierType'
                  identifier_id:
                    type: string
                    format: uuid
                  previous_identifier_id:
                    type: string
                    format: uuid
      examples:
        - name: example
          payload:
            specversion: '1.0'
            id: 0192f1c4-8d3a-7b2e-9f10-2c4d5e6f7a8b
            source: /auth1
            type: account.identifier_changed
            subject: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
            time: '2026-10-16T09:30:00.000Z'
            datacontenttype: application/json
            dataversion: 1
            accountversion: 3
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            data:
              account_id: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
              identifier_type: email
              identifier_id: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
              previous_identifier_id: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
    account_password_changed_v1:
      name: account.password_changed
      title: account.password_changed v1
      summary: The account holder changed the password. Every other session was revoked.
      traits:
        - $ref: '#/components/messageTraits/cloudEvent'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type:
                const: account.password_changed
              dataversion:
                const: 1
              data:
                type: object
                additionalProperties: false
                required:
                  - account_id
                properties:
                  account_id:
                    $ref: '#/components/schemas/AccountId'
      examples:
        - name: example
          payload:
            specversion: '1.0'
            id: 0192f1c4-8d3a-7b2e-9f10-2c4d5e6f7a8b
            source: /auth1
            type: account.password_changed
            subject: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
            time: '2026-10-16T09:30:00.000Z'
            datacontenttype: application/json
            dataversion: 1
            accountversion: 3
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            data:
              account_id: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
    account_password_reset_v1:
      name: account.password_reset
      title: account.password_reset v1
      summary: A password reset completed. Every session was revoked; the status did not change.
      traits:
        - $ref: '#/components/messageTraits/cloudEvent'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type:
                const: account.password_reset
              dataversion:
                const: 1
              data:
                type: object
                additionalProperties: false
                required:
                  - account_id
                  - step_up
                properties:
                  account_id:
                    $ref: '#/components/schemas/AccountId'
                  step_up:
                    type: boolean
                    description: Whether a second factor was required
      examples:
        - name: example
          payload:
            specversion: '1.0'
            id: 0192f1c4-8d3a-7b2e-9f10-2c4d5e6f7a8b
            source: /auth1
            type: account.password_reset
            subject: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
            time: '2026-10-16T09:30:00.000Z'
            datacontenttype: application/json
            dataversion: 1
            accountversion: 3
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
            data:
              account_id: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
              step_up: true
    account_status_changed_v1:
      name: account.status_changed
      title: account.status_changed v1
      summary: The account's status changed through account control.
      traits:
        - $ref: '#/components/messageTraits/cloudEvent'
      payload:
        allOf:
          - $ref: '#/components/schemas/CloudEvent'
          - type: object
            properties:
              type:
