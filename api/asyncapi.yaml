    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_deleted:
    address: account.deleted
    title: account.deleted
    description: The account was closed. Its sessions are revoked and its identifiers released.
    messages:
      account_deleted_v1:
        $ref: '#/components/messages/account_deleted_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
operations:
  publish_account_registered:
    action: send
    title: Publish account.registered
    summary: 'A registration completed: every required identifier is verified and the account is active.'
    channel:
      $ref: '#/channels/account_registered'
    messages:
      - $ref: '#/channels/account_registered/messages/account_registered_v1'
    bindings:
      amqp:
        deliveryMode: 2
        mandatory: false
        ack: true
        bindingVersion: 0.3.0
    description: >-
      Written to the outbox in the transaction that made the change, then published by the relay
      with publisher confirms. At least once, in order per account.
