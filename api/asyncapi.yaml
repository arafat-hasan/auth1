components:
  schemas:
    AccountId:
      type: string
      format: uuid
      description: A UUIDv7
    AccountStatus:
      type: string
      enum:
      - pending
      - active
      - suspended
      - banned
      - deleted
    IdentifierType:
      type: string
      description: A type from the deployment's identifier policy
      pattern: ^[a-z][a-z0-9_]{0,31}$
    Role:
      type: string
      description: A role from the deployment's catalog
      pattern: ^[a-z][a-z0-9_]{0,49}$
    Actor:
      type: object
      description: Who caused the change
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - account
          - service
          - operator
          - system
        id:
          type: string
          description: The account id, the calling service's workload identity or client id, the operator's
            name, or the system job
        on_behalf_of:
          type: string
          maxLength: 128
          description: The person a calling service acted for, verbatim from its Auth1-Actor header
    CloudEvent:
      type: object
      description: CloudEvents 1.0 attributes, as auth1 sets them
      required:
      - specversion
      - id
      - source
      - type
      - subject
      - time
      - datacontenttype
      - dataversion
      - accountversion
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
          description: UUIDv7, stable per outbox row. The deduplication key
        source:
          type: string
          format: uri-reference
          description: The deployment's `events.source`, default /auth1
        type:
          type: string
          description: The event type; also the routing key
        subject:
          type: string
          format: uuid
          description: The account id
        time:
          type: string
          format: date-time
          description: When the change committed
        datacontenttype:
          type: string
          const: application/json
        dataversion:
          type: integer
          minimum: 1
          description: Extension. The version of the `data` schema
        accountversion:
          type: integer
          minimum: 1
          description: Extension. The account's version after the change. Monotonic per account, not contiguous
        traceparent:
          type: string
          description: Extension (distributed tracing). W3C trace context
        tracestate:
          type: string
          description: Extension (distributed tracing)
        data:
          type: object
  messageTraits:
    cloudEvent:
      contentType: application/cloudevents+json
      bindings:
        amqp:
          contentEncoding: utf-8
          bindingVersion: 0.3.0
  messages:
    account_registered_v1:
      name: account.registered
      title: account.registered v1
      summary: 'A registration or an accepted invitation completed: every required identifier is verified
        and the account is active. MFA enrolment follows.'
      traits:
      - $ref: '#/components/messageTraits/cloudEvent'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          properties:
            type:
              const: account.registered
            dataversion:
              const: 1
            data:
              type: object
              additionalProperties: false
              required:
              - account_id
              - client_id
              - roles
              - locale
              - actor
              properties:
                account_id:
                  $ref: '#/components/schemas/AccountId'
                client_id:
                  type: string
                  description: The client the account registered through, or `invitation`
                roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/Role'
                locale:
                  type: string
                actor:
                  $ref: '#/components/schemas/Actor'
      examples:
      - name: example
        payload:
          specversion: '1.0'
          id: 0192f1c4-8d3a-7b2e-9f10-2c4d5e6f7a8b
          source: /auth1
          type: account.registered
          subject: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
          time: '2026-10-26T09:30:00.000Z'
          datacontenttype: application/json
          dataversion: 1
          accountversion: 7
          traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          data:
            account_id: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
            client_id: web
            roles:
            - user
            locale: en
            actor:
              kind: account
              id: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
    account_identifier_verified_v1:
      name: account.identifier_verified
      title: account.identifier_verified v1
      summary: 'An identifier was verified: at registration, at invitation acceptance, or by a resume.'
      traits:
      - $ref: '#/components/messageTraits/cloudEvent'
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          properties:
            type:
              const: account.identifier_verified
            dataversion:
              const: 1
            data:
              type: object
              additionalProperties: false
              required:
              - account_id
              - identifier_id
              - identifier_type
              - actor
              properties:
                account_id:
                  $ref: '#/components/schemas/AccountId'
                identifier_id:
                  type: string
                  format: uuid
                identifier_type:
                  $ref: '#/components/schemas/IdentifierType'
                actor:
                  $ref: '#/components/schemas/Actor'
      examples:
      - name: example
        payload:
          specversion: '1.0'
          id: 0192f1c4-8d3a-7b2e-9f10-2c4d5e6f7a8b
          source: /auth1
          type: account.identifier_verified
          subject: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
          time: '2026-10-26T09:30:00.000Z'
          datacontenttype: application/json
          dataversion: 1
          accountversion: 7
          traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          data:
            account_id: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
            identifier_id: 0b9e8d7c-6a5f-4e3d-8c2b-1a0f9e8d7c6b
            identifier_type: phone
            actor:
              kind: account
              id: 6f1c2a9e-3b4d-4e5f-8a7b-9c0d1e2f3a4b
    account_identifier_changed_v1:
      name: account.identifier_changed
      title: account.identifier_changed v1
      summary: An email or phone change applied, by the account or through support. The previous identifier
        is no longer current.
      traits:
