asyncapi: 3.0.0
info:
  title: auth1 lifecycle events
  version: 1.0.0
  description: |
    Account lifecycle events published by auth1 through its transactional outbox, to its own
    topic exchange (`events.exchange`, default `auth1.events`). The routing key is the event type.

    Every message is a **CloudEvents 1.0** event in structured JSON mode
    (`application/cloudevents+json`). Delivery is at least once; consumers deduplicate on `id`.

    **Order.** One account's events are published in `accountversion` order. Versions are
    monotonic but not contiguous: a change that emits no event still moves the version, so
    consumers must accept gaps and use the version only to order and to discard stale data.

    **No identifier value (email, phone), display name or secret (password, code, token) ever
    appears in an event.** A consumer that needs a value reads it from the directory API.

    Design: docs/design.md D-15 and docs/tdd/TDD-06-events-and-delivery.md.
  contact:
    name: auth1 maintainers
    url: https://github.com/arafat-hasan/auth1
  license:
    name: Proprietary
  tags:
  - name: identity
    description: Account lifecycle
defaultContentType: application/cloudevents+json
servers:
  broker:
    host: broker.example.internal:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: The deploying product's broker. auth1's user may write only to its own exchange
channels:
  account_registered:
    address: account.registered
    title: account.registered
    description: 'A registration or an accepted invitation completed: every required identifier is verified
      and the account is active. MFA enrolment follows.'
    messages:
      account_registered_v1:
        $ref: '#/components/messages/account_registered_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_identifier_verified:
    address: account.identifier_verified
    title: account.identifier_verified
    description: 'An identifier was verified: at registration, at invitation acceptance, or by a resume.'
    messages:
      account_identifier_verified_v1:
        $ref: '#/components/messages/account_identifier_verified_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_identifier_changed:
    address: account.identifier_changed
    title: account.identifier_changed
    description: An email or phone change applied, by the account or through support. The previous identifier
      is no longer current.
    messages:
      account_identifier_changed_v1:
        $ref: '#/components/messages/account_identifier_changed_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_profile_updated:
    address: account.profile_updated
    title: account.profile_updated
    description: The display name or the locale changed. Consumers that cache the display name read it
      from the directory.
    messages:
      account_profile_updated_v1:
        $ref: '#/components/messages/account_profile_updated_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_password_changed:
    address: account.password_changed
    title: account.password_changed
    description: The account holder changed the password. Every other session was revoked.
    messages:
      account_password_changed_v1:
        $ref: '#/components/messages/account_password_changed_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_password_reset:
    address: account.password_reset
    title: account.password_reset
    description: A password reset completed. Every session was revoked; the status and the TOTP factor
      did not change.
    messages:
      account_password_reset_v1:
        $ref: '#/components/messages/account_password_reset_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_mfa_enrolled:
    address: account.mfa_enrolled
    title: account.mfa_enrolled
    description: The account confirmed its first TOTP factor. Its first full session follows.
    messages:
      account_mfa_enrolled_v1:
        $ref: '#/components/messages/account_mfa_enrolled_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_mfa_reset:
    address: account.mfa_reset
    title: account.mfa_reset
    description: A service reset the account's lost second factor. The factor and recovery codes were
      erased and every session revoked; the next sign-in enrols again.
    messages:
      account_mfa_reset_v1:
        $ref: '#/components/messages/account_mfa_reset_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_status_changed:
    address: account.status_changed
    title: account.status_changed
    description: The account's status changed through account control.
    messages:
      account_status_changed_v1:
        $ref: '#/components/messages/account_status_changed_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_roles_changed:
    address: account.roles_changed
    title: account.roles_changed
    description: The account's roles were replaced through account control.
    messages:
      account_roles_changed_v1:
        $ref: '#/components/messages/account_roles_changed_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_sessions_revoked:
    address: account.sessions_revoked
    title: account.sessions_revoked
    description: Every session of the account was revoked at once (by a service, a status change, a role
      removal or an operator). Sign-out and per-session revocations are not reported.
    messages:
      account_sessions_revoked_v1:
        $ref: '#/components/messages/account_sessions_revoked_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_registration_expired:
    address: account.registration_expired
    title: account.registration_expired
    description: A registration or invitation expired before it completed. The pending account's identifiers
      were released and the account closed.
    messages:
      account_registration_expired_v1:
        $ref: '#/components/messages/account_registration_expired_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  account_deleted:
    address: account.deleted
    title: account.deleted
    description: The account was closed. Its sessions are revoked, its credentials and factors erased,
      and its identifiers released.
    messages:
      account_deleted_v1:
        $ref: '#/components/messages/account_deleted_v1'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: auth1.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
