          properties:
            type:
              const: account.identifier_changed
            dataversion:
              const: 1
            data:
              type: object
              additionalProperties: false
              required:
              - account_id
              - identifier_type
              - identifier_id
              - previous_identifier_id
              - actor
              properties:
                account_id:
                  $ref: '#/components/schemas/AccountId'
                identifier_type:
                  $ref: '#/components/schemas/IdentifierType'
                identifier_id:
                  type: string
                  format: uuid
                previous_identifier_id:
