      - health
  /livez:
    get:
      description: Returns 200 if the process is running and goroutines are below
        threshold. No external dependency checks.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.LivezResponse'
