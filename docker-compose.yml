services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: auth1
      POSTGRES_USER: auth1
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Insight - Official Redis GUI (development only)
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - RITRUSTEDORIGINS=http://localhost:5540

  # Migration service - runs migrations and exits
  migrations:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: auth1
      DATABASE_PASSWORD: password
      DATABASE_NAME: auth1
      DATABASE_SSL_MODE: disable
      APP_ENVIRONMENT: development
    volumes:
      - ./config.yaml:/root/config.yaml:ro
    working_dir: /root
    command: ["sh", "-c", "set -e && echo 'Starting migrations...' && ./migrate init && ./migrate up && echo 'Running seed data...' && ./migrate seed && echo 'Migration and seeding completed successfully'"]
    restart: "no"
    healthcheck:
      test: ["CMD", "echo", "Migration service health check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    environment:
      RABBITMQ_DEFAULT_USER: auth1
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: auth1
      DATABASE_PASSWORD: password
      DATABASE_NAME: auth1
      DATABASE_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_ENVIRONMENT: development
      APP_LOG_LEVEL: debug
      AMQP_URL: amqp://auth1:password@rabbitmq:5672/
    volumes:
      - ./config.yaml:/root/config.yaml:ro
      - ./assets:/root/assets:ro

volumes:
  postgres_data:
  redis_data:
  redis_insight_data: 